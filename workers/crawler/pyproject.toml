[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "kitacon-crawler"
version = "0.1.0"
description = "Policy-first KitaCon crawler worker"
requires-python = ">=3.12,<3.15"
dependencies = [
  "boto3==1.43.81",
  "psycopg[binary]==3.3.4",
  "pydantic==2.13.4",
  "pillow==12.1.1",
  "pypdf==6.7.1",
  "python-dotenv==1.2.3",
  "rich==14.3.4",
  "scrapling[fetchers]==0.4.15",
  "typer==0.27.1",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
]

[project.scripts]
crawler = "kita_crawler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
